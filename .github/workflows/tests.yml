name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      # Report both platforms even if one fails.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: .venv/bin/python
          - os: windows-latest
            venv-python: .venv/Scripts/python.exe

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      # checkout@v5 and setup-python@v6 are the first official majors whose action.yml
      # declares `using: node24` (checkout@v4 and setup-python@v5 declare node20).
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Project rule: always use .venv, never the system Python (see AGENTS.md).
      # tests/test_environment.py asserts it runs inside a virtual environment.
      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Install dependencies
        run: |
          ${{ matrix.venv-python }} -m pip install --upgrade pip
          ${{ matrix.venv-python }} -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ${{ matrix.venv-python }} -m ruff check .

      - name: Run tests
        run: |
          ${{ matrix.venv-python }} -m pytest -q -rs

      # The evaluator exits 2 both for a crash and for the business outcome
      # "completed_with_errors", so the gate judges the JSON report against committed
      # expectations instead of the exit code.
      - name: Gate label evaluation on the synthetic dataset
        run: |
          ${{ matrix.venv-python }} -X utf8 tools/check_evaluation_expectations.py
