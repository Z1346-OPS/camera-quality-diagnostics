name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Project rule: always use .venv, never the system Python (see AGENTS.md).
      # tests/test_environment.py asserts it runs inside a virtual environment.
      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          .venv/bin/python -m pytest -q

      # The evaluator exits 2 both for a crash and for the business outcome
      # "completed_with_errors", so the gate judges the JSON report against committed
      # expectations instead of the exit code.
      - name: Gate label evaluation on the synthetic dataset
        run: |
          .venv/bin/python -X utf8 tools/check_evaluation_expectations.py
